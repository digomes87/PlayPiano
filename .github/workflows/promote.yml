name: Promote develop to main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge tested develop commit into main
        run: |
          git fetch origin develop
          if git merge --ff-only "$TESTED_SHA"; then
            exit 0
          fi
          git merge --no-ff "$TESTED_SHA" -m "chore: promote develop to main (${TESTED_SHA::7})"

      - name: Push main
        run: git push origin HEAD:main

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy is called here.
  deploy:
    needs: promote
    uses: ./.github/workflows/deploy.yml
